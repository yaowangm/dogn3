<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Dogn</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png?v={{ASSET_VERSION}}" sizes="64x64">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v={{ASSET_VERSION}}">
    <link rel="apple-touch-icon" href="/assets/favicon.png?v={{ASSET_VERSION}}">
    <link rel="stylesheet" href="/assets/css/app.css?v={{ASSET_VERSION}}">
    <script defer src="/assets/js/i18n.js?v={{ASSET_VERSION}}"></script>
    <script defer src="/assets/js/app.js?v={{ASSET_VERSION}}"></script>
  </head>
  <body>
    <dogn-app-shell>
      <div class="app-shell">
        <header class="topbar">
          <div class="topbar__inner">
            <div class="brand">
              <span>Dogn</span>
            </div>
            <nav class="nav" aria-label="Primary navigation">
              <a class="login-link" href="/login">login</a>
            </nav>
          </div>
        </header>
        <main class="main" id="main-content">
          <section class="intro" hidden aria-labelledby="page-title">
            <p class="eyebrow">Forum</p>
            <h1 id="page-title">Dogn</h1>
            <p class="loading-state">
              <svg class="loading-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle class="loading-icon__track" cx="12" cy="12" r="8" />
                <path class="loading-icon__dash" d="M12 4a8 8 0 0 1 8 8" />
              </svg>
              <span>Loading data...</span>
            </p>
          </section>
          <section class="dashboard" aria-label="Loading data...">
            <section class="section section--wide">
              <p class="section__state loading-state">
                <svg class="loading-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle class="loading-icon__track" cx="12" cy="12" r="8" />
                  <path class="loading-icon__dash" d="M12 4a8 8 0 0 1 8 8" />
                </svg>
                <span>Loading data...</span>
              </p>
            </section>
          </section>
        </main>
      </div>
    </dogn-app-shell>
  </body>
</html>
