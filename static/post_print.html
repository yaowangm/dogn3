<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Print post</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png?v={{ASSET_VERSION}}" sizes="64x64">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v={{ASSET_VERSION}}">
    <link rel="apple-touch-icon" href="/assets/favicon.png?v={{ASSET_VERSION}}">
    <link rel="stylesheet" href="/assets/css/app.css?v={{ASSET_VERSION}}">
    <script defer src="/assets/js/i18n.js?v={{ASSET_VERSION}}"></script>
    <script defer src="/assets/js/app.js?v={{ASSET_VERSION}}"></script>
  </head>
  <body>
    <dogn-app-shell data-page-mode="print">
      <main class="print-page">
        <p class="print-page__state loading-state">
          <svg class="loading-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle class="loading-icon__track" cx="12" cy="12" r="8" />
            <path class="loading-icon__dash" d="M12 4a8 8 0 0 1 8 8" />
          </svg>
          <span>Loading post...</span>
        </p>
      </main>
    </dogn-app-shell>
  </body>
</html>
