services:
  app:
    build:
      context: .
    image: dogn3:local
    restart: unless-stopped
    env_file:
      - ${DOGN_ENV_FILE:-.env.docker}
    ports:
      - "${DOGN_HTTP_PORT:-3000}:3000"
    volumes:
      - ${DOGN_IMAGE_DIR:-./data/images}:/app/images
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
