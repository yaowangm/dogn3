<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">dogn3 database ER diagram</title>
  <desc id="desc">Entity relationship diagram for category, board, board_master, post, user_info, favorite, point_log, sign_log, and info_bak.</desc>
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .table { fill: #ffffff; stroke: #202123; stroke-width: 1.5; }
      .table-title { fill: #f7f7f4; stroke: #202123; stroke-width: 1.5; }
      .title-text { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202123; }
      .field-text { font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202123; }
      .muted-text { fill: #6e6e80; }
      .relation { fill: none; stroke: #202123; stroke-width: 1.5; }
      .relation-soft { fill: none; stroke: #6e6e80; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .marker { fill: #202123; stroke: #202123; stroke-width: 1.5; }
      .note { font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6e80; }
    </style>
    <marker id="many" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="strokeWidth">
      <path class="marker" d="M14 7 L2 1 M14 7 L2 7 M14 7 L2 13" />
    </marker>
    <marker id="one" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto" markerUnits="strokeWidth">
      <path class="marker" d="M8 1 L8 11" />
    </marker>
  </defs>

  <rect class="canvas" width="1280" height="900" />

  <text x="48" y="48" class="title-text">dogn3 ER diagram</text>
  <text x="48" y="72" class="note">Most relationships are inferred; board_master has explicit foreign key constraints.</text>

  <!-- category -->
  <g id="category" transform="translate(48 120)">
    <rect class="table" width="210" height="156" rx="8" />
    <rect class="table-title" width="210" height="42" rx="8" />
    <path class="table-title" d="M0 34 H210 V42 H0 Z" />
    <text class="title-text" x="16" y="27">category</text>
    <text class="field-text" x="16" y="66">PK id</text>
    <text class="field-text" x="16" y="90">name</text>
    <text class="field-text" x="16" y="114">comment</text>
    <text class="field-text" x="16" y="138">order_id</text>
    <text class="field-text" x="16" y="162">board_count</text>
  </g>

  <!-- board -->
  <g id="board" transform="translate(360 108)">
    <rect class="table" width="240" height="220" rx="8" />
    <rect class="table-title" width="240" height="42" rx="8" />
    <path class="table-title" d="M0 34 H240 V42 H0 Z" />
    <text class="title-text" x="16" y="27">board</text>
    <text class="field-text" x="16" y="66">PK id</text>
    <text class="field-text" x="16" y="90">FK category_id</text>
    <text class="field-text" x="16" y="114">name</text>
    <text class="field-text" x="16" y="138">comment</text>
    <text class="field-text" x="16" y="162">post_count</text>
    <text class="field-text" x="16" y="186">root_count</text>
    <text class="field-text muted-text" x="16" y="210">master_id legacy</text>
    <text class="field-text" x="16" y="234">order_id</text>
  </g>

  <!-- board_master -->
  <g id="board-master" transform="translate(378 356)">
    <rect class="table" width="230" height="126" rx="8" />
    <rect class="table-title" width="230" height="42" rx="8" />
    <path class="table-title" d="M0 34 H230 V42 H0 Z" />
    <text class="title-text" x="16" y="27">board_master</text>
    <text class="field-text" x="16" y="66">PK/FK board_id</text>
    <text class="field-text" x="16" y="90">PK/FK user_id</text>
    <text class="field-text" x="16" y="114">order_id</text>
  </g>

  <!-- post -->
  <g id="post" transform="translate(720 88)">
    <rect class="table" width="280" height="412" rx="8" />
    <rect class="table-title" width="280" height="42" rx="8" />
    <path class="table-title" d="M0 34 H280 V42 H0 Z" />
    <text class="title-text" x="16" y="27">post</text>
    <text class="field-text" x="16" y="66">PK id</text>
    <text class="field-text" x="16" y="90">FK board_id</text>
    <text class="field-text" x="16" y="114">FK user_id</text>
    <text class="field-text" x="16" y="138">FK parent_id</text>
    <text class="field-text" x="16" y="162">FK root_id</text>
    <text class="field-text" x="16" y="186">level</text>
    <text class="field-text" x="16" y="210">order_num</text>
    <text class="field-text muted-text" x="16" y="234">order_num_2 unused</text>
    <text class="field-text" x="16" y="258">subject</text>
    <text class="field-text" x="16" y="282">content, content_format</text>
    <text class="field-text" x="16" y="306">post_time, reply_time</text>
    <text class="field-text" x="16" y="330">reply_count, access_count</text>
    <text class="field-text" x="16" y="354">type, state, folder_id</text>
    <text class="field-text" x="16" y="378">point, sign_id</text>
    <text class="field-text" x="16" y="402">link_name, link_url, image_url</text>
  </g>

  <!-- user_info -->
  <g id="user-info" transform="translate(48 430)">
    <rect class="table" width="270" height="340" rx="8" />
    <rect class="table-title" width="270" height="42" rx="8" />
    <path class="table-title" d="M0 34 H270 V42 H0 Z" />
    <text class="title-text" x="16" y="27">user_info</text>
    <text class="field-text" x="16" y="66">PK id</text>
    <text class="field-text" x="16" y="90">name</text>
    <text class="field-text" x="16" y="114">password</text>
    <text class="field-text" x="16" y="138">state, level</text>
    <text class="field-text" x="16" y="162">email, intro</text>
    <text class="field-text" x="16" y="186">reg_time</text>
    <text class="field-text" x="16" y="210">post_count, doc_count</text>
    <text class="field-text" x="16" y="234">last_login, last_login_ip</text>
    <text class="field-text" x="16" y="258">last_origin, last_reship</text>
    <text class="field-text" x="16" y="282">last_post, login_count</text>
    <text class="field-text" x="16" y="306">point, intro_user_id</text>
    <text class="field-text" x="16" y="330">sign_id, favorite_count</text>
    <text class="field-text" x="16" y="354">log_error_time, log_error_count</text>
  </g>

  <!-- favorite -->
  <g id="favorite" transform="translate(420 536)">
    <rect class="table" width="230" height="150" rx="8" />
    <rect class="table-title" width="230" height="42" rx="8" />
    <path class="table-title" d="M0 34 H230 V42 H0 Z" />
    <text class="title-text" x="16" y="27">favorite</text>
    <text class="field-text" x="16" y="66">PK id</text>
    <text class="field-text" x="16" y="90">FK user_id</text>
    <text class="field-text" x="16" y="114">FK post_id</text>
    <text class="field-text" x="16" y="138">create_time</text>
  </g>

  <!-- point_log -->
  <g id="point-log" transform="translate(720 580)">
    <rect class="table" width="240" height="174" rx="8" />
    <rect class="table-title" width="240" height="42" rx="8" />
    <path class="table-title" d="M0 34 H240 V42 H0 Z" />
    <text class="title-text" x="16" y="27">point_log</text>
    <text class="field-text" x="16" y="66">PK id</text>
    <text class="field-text" x="16" y="90">FK user_id</text>
    <text class="field-text" x="16" y="114">FK post_id</text>
    <text class="field-text" x="16" y="138">point</text>
    <text class="field-text" x="16" y="162">post_time</text>
  </g>

  <!-- sign_log -->
  <g id="sign-log" transform="translate(1020 580)">
    <rect class="table" width="210" height="150" rx="8" />
    <rect class="table-title" width="210" height="42" rx="8" />
    <path class="table-title" d="M0 34 H210 V42 H0 Z" />
    <text class="title-text" x="16" y="27">sign_log</text>
    <text class="field-text" x="16" y="66">PK id</text>
    <text class="field-text" x="16" y="90">FK user_id</text>
    <text class="field-text" x="16" y="114">sign_id</text>
    <text class="field-text" x="16" y="138">set_time</text>
  </g>

  <!-- info_bak -->
  <g id="info-bak" transform="translate(48 802)">
    <rect class="table" width="270" height="54" rx="8" />
    <rect class="table-title" width="270" height="54" rx="8" />
    <text class="title-text" x="16" y="25">info_bak</text>
    <text class="field-text muted-text" x="16" y="45">archive copy of user_info</text>
  </g>

  <!-- Relationships -->
  <path class="relation" d="M258 198 H360" marker-start="url(#one)" marker-end="url(#many)" />
  <text class="note" x="286" y="188">category 1:N board</text>

  <path class="relation" d="M600 205 H720" marker-start="url(#one)" marker-end="url(#many)" />
  <text class="note" x="628" y="195">board 1:N post</text>

  <path class="relation" d="M480 328 V356" marker-start="url(#one)" marker-end="url(#many)" />
  <path class="relation" d="M378 420 H318 V500" marker-start="url(#many)" marker-end="url(#one)" />
  <text class="note" x="414" y="346">managers</text>

  <path class="relation" d="M720 392 C650 392 650 250 720 250" marker-start="url(#one)" marker-end="url(#many)" />
  <text class="note" x="604" y="333">post tree parent/root</text>

  <path class="relation" d="M318 565 C500 565 500 202 720 202" marker-start="url(#one)" marker-end="url(#many)" />
  <text class="note" x="426" y="502">user authors posts</text>

  <path class="relation" d="M318 612 H420" marker-start="url(#one)" marker-end="url(#many)" />
  <path class="relation" d="M650 612 C680 612 690 488 720 488" marker-start="url(#many)" marker-end="url(#one)" />
  <text class="note" x="434" y="708">favorite joins user_info and post</text>

  <path class="relation" d="M318 690 C480 690 550 668 720 668" marker-start="url(#one)" marker-end="url(#many)" />
  <path class="relation" d="M840 580 C840 540 840 520 840 500" marker-start="url(#many)" marker-end="url(#one)" />
  <text class="note" x="736" y="778">point_log references user_info and post</text>

  <path class="relation" d="M318 730 C520 820 920 780 1020 684" marker-start="url(#one)" marker-end="url(#many)" />
  <text class="note" x="1008" y="760">signature history</text>

  <path class="relation-soft" d="M183 770 V802" marker-start="url(#one)" marker-end="url(#many)" />
  <text class="note" x="202" y="792">backup/archive</text>
</svg>
